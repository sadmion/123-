name: CI 环境自检

# 独立的最小工作流：验证 Actions 环境能否执行 shell / docker / 多架构构建。
# 用于排查主构建工作流异常时，是环境问题还是脚本问题。
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci-diagnose.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Shell 可用性
        run: |
          echo "bash 版本: $BASH_VERSION"
          echo "事件: $GITHUB_EVENT_NAME"
          echo "ref: $GITHUB_REF | type: $GITHUB_REF_TYPE"

      - name: Docker 可用性
        run: |
          docker version
          docker buildx version
          docker buildx ls

      - name: 注册 binfmt（多架构构建的前提）
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install all
          echo "--- 已注册的 binfmt 条目 ---"
          ls /proc/sys/fs/binfmt_misc/ || true

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 单架构构建测试
        run: |
          mkdir -p /tmp/dtest
          printf 'FROM alpine:3.20\nRUN echo hello > /hello.txt\n' > /tmp/dtest/Dockerfile
          docker buildx build --load --tag citest:local /tmp/dtest
          echo "单架构构建成功"

      - name: 多架构构建测试
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag citest:multi \
            --output type=oci,dest=/tmp/test.tar \
            /tmp/dtest
          ls -lh /tmp/test.tar
          echo "多架构构建成功"
