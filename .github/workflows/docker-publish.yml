name: 构建并发布容器镜像

# 打标签（如 v1.0.3）时自动构建镜像并推送到 GitHub 容器仓库（GHCR），
# 任何服务器都能直接 docker pull，无需自行 build，也不需要 Windows 机器。
# 也支持在 Actions 页面手动触发。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      statuses: write        # 失败时上报诊断信息需要

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 QEMU（用于构建 arm64 镜像）
        uses: docker/setup-qemu-action@v3

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像名与标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # 用最朴素的 buildx 原生命令构建，避免 action 封装层掩盖真实报错。
      # 双架构：amd64（云服务器 / x86 NAS）+ arm64（树莓派 / ARM NAS）。
      - name: 构建并推送
        id: build
        run: |
          set -x
          PRIMARY=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          # metadata 会输出多行标签，逐行转成 --tag 参数
          TAGS=""
          while IFS= read -r t; do
            [ -n "$t" ] && TAGS="$TAGS --tag $t"
          done <<< "${{ steps.meta.outputs.tags }}"

          docker buildx build \
            --file docker/Dockerfile \
            --platform linux/amd64,linux/arm64 \
            $TAGS \
            --push \
            .

      # 失败时把诊断写入 commit status，便于从外部（无需登录）读取
      - name: 上报失败诊断
        if: failure()
        run: |
          MSG="构建失败，请查看 Actions 日志（run $GITHUB_RUN_ID）"
          curl -s -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"failure\",\"context\":\"docker-build\",\"description\":\"$MSG\",\"target_url\":\"https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" \
            -o /dev/null -w "上报诊断 HTTP %{http_code}\n" || true
