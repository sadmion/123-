name: 构建并发布容器镜像

# 打标签（如 v1.0.3）时自动构建镜像并推送到 GitHub 容器仓库（GHCR），
# 任何服务器都能直接 docker pull，无需自行 build，也不需要 Windows 机器。
# 也支持在 Actions 页面手动触发（Actions → 本工作流 → Run workflow）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 QEMU（用于构建 arm64 镜像）
        uses: docker/setup-qemu-action@v3

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 直接用 buildx 构建，标签在这里显式拼装，避免多行 metadata 输出
      # 在 shell 里被拆分导致脚本解析异常的坑。
      - name: 构建并推送
        shell: bash
        run: |
          set -euxo pipefail
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY}"

          # 版本标签：优先取 git tag（v1.0.3 → 1.0.3），分支构建则用 short sha
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="sha-${GITHUB_SHA::7}"
          fi

          docker buildx build \
            --file docker/Dockerfile \
            --platform linux/amd64,linux/arm64 \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:latest" \
            --push \
            .

      - name: 校验镜像已发布
        shell: bash
        run: |
          set -eu
          echo "镜像已推送，标签如下："
          echo "  ${REGISTRY}/${GITHUB_REPOSITORY}:latest"
