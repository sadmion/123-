name: 构建并发布容器镜像

# 打标签（如 v1.0.3）时自动构建镜像并推送到 GitHub 容器仓库（GHCR），
# 这样任何服务器都能直接 docker pull，无需自行 build，也不需要 Windows 机器。
# 也支持在 Actions 页面手动触发（Actions → 本工作流 → Run workflow）。
#
# 构建策略：默认同时出 amd64 + arm64（NAS / 树莓派 / 云服务器共用）。
# 若 arm64 在 QEMU 模拟下构建超时，可只保留 amd64 —— 见下方 platforms 注释。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platforms:
        description: "目标架构（默认双架构；排查问题时填 linux/amd64）"
        required: false
        default: "linux/amd64,linux/arm64"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # 推送镜像到 GHCR 需要

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 QEMU（用于构建 arm64 镜像）
        uses: docker/setup-qemu-action@v3

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 环境与权限自检
        run: |
          echo "=== 事件: $GITHUB_EVENT_NAME | 分支: $GITHUB_REF ==="
          echo "=== 仓库: $GITHUB_REPOSITORY ==="
          echo "=== buildx 版本 ==="
          docker buildx version || true
          echo "=== 目标镜像名 ==="
          echo "${REGISTRY}/${IMAGE_NAME}:latest"
          echo "=== 尝试 GHCR 登录（失败会立刻暴露权限问题）==="
          echo "token 长度: ${#GITHUB_TOKEN}"
          echo "--- 探测 token 是否有 write:packages ---"
          curl -s -o /dev/null -w "GET /user -> HTTP %{http_code}\n" \
            -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/user || true
          echo "--- 探测 GHCR 推送凭据 ---"
          curl -s -o /dev/null -w "GET package list -> HTTP %{http_code}\n" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/user/packages?package_type=container" || true

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签与元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: 构建并推送
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          # 手动触发时可用参数覆盖，便于只构建单架构排查问题
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 构建缓存复用，二次构建显著提速
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 输出完整构建日志，失败时便于定位
          provenance: false

      # 失败时把关键报错写进 commit status，便于从外部（无需登录）诊断
      - name: 记录失败原因
        if: failure()
        run: |
          MSG=$(docker buildx ls 2>&1 | head -5 | tr '\n' ';' | cut -c1-120)
          echo "构建失败。buildx 状态: $MSG"
          curl -s -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"failure\",\"context\":\"docker-build-debug\",\"description\":\"$MSG\"}" \
            -o /dev/null -w "上报诊断 HTTP %{http_code}\n" || true
