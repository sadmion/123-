name: 构建并发布容器镜像

# 打标签（如 v1.0.3）时自动构建镜像并推送到 GitHub 容器仓库（GHCR），
# 任何服务器都能直接 docker pull，无需自行 build，也不需要 Windows 机器。
# 也支持在 Actions 页面手动触发（Actions → 本工作流 → Run workflow）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # ⚠️ 镜像名必须单独指定，不能沿用仓库名（${{ github.repository }}）。
  # 本仓库名为 "123-"，结尾是连字符，而 Docker 要求镜像路径的每个组件
  # 以字母或数字结尾（[a-z0-9]+([._-][a-z0-9]+)*），"123-" 属非法名称，
  # 会导致 GHCR 无法创建该包、客户端 pull 时直接解析失败。
  IMAGE_NAME: pan123-library

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 校验镜像名合法性
        shell: bash
        run: |
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}"
          echo "镜像地址: ${IMAGE}"
          # 逐组件校验：每个路径组件必须满足 [a-z0-9]+([._-][a-z0-9]+)*
          if ! printf '%s' "${IMAGE}" | grep -Eq '^[a-z0-9]+([._-][a-z0-9]+)*(:[0-9]+)?(/[a-z0-9]+([._-][a-z0-9]+)*)+$'; then
            echo "::error::镜像名不合法: ${IMAGE}"
            exit 1
          fi
          echo "镜像名合法"

      # 多架构构建需要 QEMU 注册 binfmt，官方 action 已封装该步骤
      - name: 安装 QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 环境自检
        shell: bash
        run: |
          echo "=== buildx 实例 ==="
          docker buildx ls
          echo "=== 测试 arm64 容器能否运行（QEMU 是否生效）==="
          if docker run --rm --platform linux/arm64 alpine:3.20 uname -m; then
            echo "arm64 QEMU 可用"
            echo "ARM_OK=1" >> "$GITHUB_ENV"
          else
            echo "arm64 QEMU 不可用，将只构建 amd64"
            echo "ARM_OK=0" >> "$GITHUB_ENV"
          fi

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        shell: bash
        run: |
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="sha-${GITHUB_SHA::7}"
          fi

          # arm64 的 QEMU 不可用时降级为单架构，保证镜像至少能发布出来
          if [ "${ARM_OK}" = "1" ]; then
            PLATFORMS="linux/amd64,linux/arm64"
          else
            PLATFORMS="linux/amd64"
          fi

          echo "IMAGE     = ${IMAGE}"
          echo "VERSION   = ${VERSION}"
          echo "PLATFORMS = ${PLATFORMS}"

          docker buildx build \
            --file docker/Dockerfile \
            --platform "${PLATFORMS}" \
            --build-arg "APP_VERSION=${VERSION}" \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:latest" \
            --push \
            . 2>&1 | tee /tmp/build.log
          exit "${PIPESTATUS[0]}"

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: ignore
