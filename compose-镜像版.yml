# ============================================================
# 123云盘影库搜索工具 —— Docker Compose（拉取现成镜像版）
#
# 用法：
#   1) 把本文件保存为 docker-compose.yml
#   2) 同目录下建一个 data 文件夹（放影库数据）
#   3) docker compose up -d
#   4) 浏览器访问 http://<这台机器的IP>:5890/
#
# 前提：GHCR 上的包已设为 Public（否则会 unauthorized）
#
# 升级：docker compose pull && docker compose up -d
# 日志：docker compose logs -f
# 停止：docker compose down          （data/ 数据不受影响）
# ============================================================
services:
  pan123-library:
    image: ghcr.io/sadmion/pan123-library:latest
    container_name: pan123-library
    restart: unless-stopped

    # 宿主机端口:容器端口。想换端口改左边，例如 "8080:5890"
    ports:
      - "5890:5890"

    environment:
      TZ: Asia/Shanghai
      # 容器内没有 GUI，跳过 pywebview 桌面窗口
      LB_BROWSER: "1"
      # 数据目录（对应下面的挂载点）
      LB_DATA_ROOT: /data

    volumes:
      # 影库 JSON、导出文件、登录凭据、日志都在这里，删容器不会丢
      - ./data:/data

    # 秒传批量导入是 IO + 网络密集，给足文件句柄
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    # 限制日志体积，避免长期运行撑爆磁盘
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
