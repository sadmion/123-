# ============================================================
# 123云盘影库搜索工具 —— Docker Compose 部署
#
# ★ 方式一（最稳，推荐）：在 NAS 上直接构建
#     1) 把整个项目目录拷到 NAS（要有 exe 和 docker/ 子目录）
#     2) docker compose up -d --build
#     3) 浏览器访问 http://<NAS的IP>:5890/
#   不依赖 GHCR / GitHub 网络，只要 NAS 能联网装 pip 依赖即可。
#
# ★ 方式二：拉取现成镜像（需 GHCR 包已设为 Public，见 docker/README.md）
#     docker compose pull && docker compose up -d
#
#   查看日志： docker compose logs -f
#   停止：     docker compose down          （data/ 数据不受影响）
#
# 数据（影库 JSON、导出文件、登录凭据、日志）全部落在项目目录下的 ./data，
# 删容器不会丢；换机器把整个项目目录拷走即可。
# ============================================================
services:
  pan123-library:
    # 默认：本地构建，镜像名仅作本地标签用途。
    # 想改用远程镜像：把下面一行换成
    #   image: ghcr.io/sadmion/pan123-library:latest
    # 并删除 build 段。
    image: pan123-library:1.0.3
    build:
      context: .
      dockerfile: docker/Dockerfile

    container_name: pan123-library
    restart: unless-stopped

    # 宿主机端口:容器端口。左边可用环境变量覆盖，例如：
    #   LB_PORT=8080 docker compose up -d
    ports:
      - "${LB_PORT:-5890}:5890"

    environment:
      TZ: Asia/Shanghai
      # 浏览器模式：跳过 pywebview 桌面窗口（容器内没有 GUI）
      LB_BROWSER: "1"
      # 数据目录（对应下面的数据卷挂载点）
      LB_DATA_ROOT: /data

    volumes:
      # 影库数据 / 登录态持久化。首次启动会自动生成子目录结构。
      - ./data:/data

    # 秒传批量导入是 IO + 网络密集，给足文件句柄
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
